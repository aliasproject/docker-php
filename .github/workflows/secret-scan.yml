name: Secret Scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history, not just the pushed commit -- a secret that only
          # exists a few commits back is still a leak once this repo is public.
          fetch-depth: 0

      # The gitleaks CLI itself is MIT-licensed and free for any use.
      # Deliberately NOT using gitleaks/gitleaks-action here -- that wrapper
      # requires a paid org license once a repo belongs to a GitHub
      # organization (this one does: aliasproject), where the free tier is
      # personal-account repos only. Calling the CLI directly sidesteps that
      # entirely and costs nothing.
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --verbose
