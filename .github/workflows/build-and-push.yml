            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.4-cli-${{ github.sha }}

      - name: Build and push PHP 8.4 FPM
        if: inputs.force_build_all || inputs.build_php_84 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.4/fpm/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.4/fpm
          file: php/8.4/fpm/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.4-fpm-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.4-fpm-${{ github.sha }}

      - name: Wait for 8.4-fpm to propagate
        if: (inputs.force_build_all || inputs.build_php_84 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.4/fpm/Dockerfile')) && (inputs.force_build_all || inputs.build_php_84 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.4/fpm-nginx/Dockerfile'))
        run: sleep 10

      - name: Build and push PHP 8.4 FPM-Nginx
        if: inputs.force_build_all || inputs.build_php_84 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.4/fpm-nginx/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.4/fpm-nginx
          file: php/8.4/fpm-nginx/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
