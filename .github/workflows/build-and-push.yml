name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build_all:
        description: "Force build all images (ignore changed files)"
        required: false
        default: false
        type: boolean
      build_php_74:
        description: "Force build PHP 7.4 images"
        required: false
        default: false
        type: boolean
      build_php_80:
        description: "Force build PHP 8.0 images"
        required: false
        default: false
        type: boolean
      build_php_81:
        description: "Force build PHP 8.1 images"
        required: false
        default: false
        type: boolean
      build_php_82:
        description: "Force build PHP 8.2 images"
        required: false
        default: false
        type: boolean
      build_php_83:
        description: "Force build PHP 8.3 images"
        required: false
        default: false
        type: boolean
      build_php_84:
        description: "Force build PHP 8.4 images"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/php

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            php/7.4/cli/Dockerfile
            php/7.4/fpm/Dockerfile
            php/7.4/fpm-nginx/Dockerfile
            php/8.0/cli/Dockerfile
            php/8.0/fpm/alpine/Dockerfile
            php/8.0/fpm/ubuntu/Dockerfile
            php/8.0/fpm-nginx/Dockerfile
            php/8.1/cli/Dockerfile
            php/8.1/fpm/Dockerfile
            php/8.1/fpm-nginx/Dockerfile
            php/8.2/fpm/Dockerfile
            php/8.2/fpm-nginx/Dockerfile
            php/8.2/frankenphp/Dockerfile
            php/8.2/frankenphp/Dockerfile.dev
            php/8.2/frankenphp/Dockerfile.wordpress
            php/8.3/cli/Dockerfile
            php/8.3/fpm/Dockerfile
            php/8.3/fpm-nginx/Dockerfile
            php/8.3/frankenphp/Dockerfile
            php/8.3/frankenphp/Dockerfile.dev
            php/8.3/frankenphp/Dockerfile.wordpress
            php/8.4/cli/Dockerfile
            php/8.4/fpm/Dockerfile
            php/8.4/fpm-nginx/Dockerfile
            php/8.4/frankenphp/Dockerfile
            php/8.4/frankenphp/Dockerfile.dev
            php/8.4/frankenphp/Dockerfile.wordpress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PHP 7.4
      - name: Build and push PHP 7.4 CLI
        if: inputs.force_build_all || inputs.build_php_74 || contains(steps.changed-files.outputs.all_changed_files, 'php/7.4/cli/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/7.4/cli
          file: php/7.4/cli/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:7.4-cli-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:7.4-cli-${{ github.sha }}

      - name: Build and push PHP 7.4 FPM
        if: inputs.force_build_all || inputs.build_php_74 || contains(steps.changed-files.outputs.all_changed_files, 'php/7.4/fpm/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/7.4/fpm
          file: php/7.4/fpm/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:7.4-fpm-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:7.4-fpm-${{ github.sha }}

      - name: Wait for 7.4-fpm to propagate
        if: (inputs.force_build_all || inputs.build_php_74 || contains(steps.changed-files.outputs.all_changed_files, 'php/7.4/fpm/Dockerfile')) && (inputs.force_build_all || inputs.build_php_74 || contains(steps.changed-files.outputs.all_changed_files, 'php/7.4/fpm-nginx/Dockerfile'))
        run: sleep 10

      - name: Build and push PHP 7.4 FPM-Nginx
        if: inputs.force_build_all || inputs.build_php_74 || contains(steps.changed-files.outputs.all_changed_files, 'php/7.4/fpm-nginx/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/7.4/fpm-nginx
          file: php/7.4/fpm-nginx/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:7.4-fpm-nginx-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:7.4-fpm-nginx-${{ github.sha }}

      # PHP 8.0
      - name: Build and push PHP 8.0 CLI
        if: inputs.force_build_all || inputs.build_php_80 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.0/cli/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.0/cli
          file: php/8.0/cli/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.0-cli-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.0-cli-${{ github.sha }}

      - name: Build and push PHP 8.0 FPM Alpine
        if: inputs.force_build_all || inputs.build_php_80 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.0/fpm/alpine/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.0/fpm/alpine
          file: php/8.0/fpm/alpine/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.0-fpm-alpine-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.0-fpm-alpine-${{ github.sha }}

      - name: Build and push PHP 8.0 FPM Ubuntu
        if: inputs.force_build_all || inputs.build_php_80 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.0/fpm/ubuntu/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.0/fpm/ubuntu
          file: php/8.0/fpm/ubuntu/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.0-fpm-ubuntu-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.0-fpm-ubuntu-${{ github.sha }}

      - name: Build and push PHP 8.0 FPM-Nginx
        if: inputs.force_build_all || inputs.build_php_80 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.0/fpm-nginx/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.0/fpm-nginx
          file: php/8.0/fpm-nginx/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.0-fpm-nginx-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.0-fpm-nginx-${{ github.sha }}

      # PHP 8.1
      - name: Build and push PHP 8.1 CLI
        if: inputs.force_build_all || inputs.build_php_81 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.1/cli/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.1/cli
          file: php/8.1/cli/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.1-cli-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.1-cli-${{ github.sha }}

      - name: Build and push PHP 8.1 FPM
        if: inputs.force_build_all || inputs.build_php_81 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.1/fpm/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.1/fpm
          file: php/8.1/fpm/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.1-fpm-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.1-fpm-${{ github.sha }}

      - name: Wait for 8.1-fpm to propagate
        if: (inputs.force_build_all || inputs.build_php_81 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.1/fpm/Dockerfile')) && (inputs.force_build_all || inputs.build_php_81 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.1/fpm-nginx/Dockerfile'))
        run: sleep 10

      - name: Build and push PHP 8.1 FPM-Nginx
        if: inputs.force_build_all || inputs.build_php_81 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.1/fpm-nginx/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.1/fpm-nginx
          file: php/8.1/fpm-nginx/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.1-fpm-nginx-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.1-fpm-nginx-${{ github.sha }}

      # PHP 8.2
      - name: Build and push PHP 8.2 FPM
        if: inputs.force_build_all || inputs.build_php_82 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.2/fpm/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.2/fpm
          file: php/8.2/fpm/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.2-fpm-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.2-fpm-${{ github.sha }}

      - name: Wait for 8.2-fpm to propagate
        if: (inputs.force_build_all || inputs.build_php_82 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.2/fpm/Dockerfile')) && (inputs.force_build_all || inputs.build_php_82 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.2/fpm-nginx/Dockerfile'))
        run: sleep 10

      - name: Build and push PHP 8.2 FPM-Nginx
        if: inputs.force_build_all || inputs.build_php_82 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.2/fpm-nginx/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.2/fpm-nginx
          file: php/8.2/fpm-nginx/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.2-fpm-nginx-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.2-fpm-nginx-${{ github.sha }}

      - name: Build and push PHP 8.2 FrankenPHP
