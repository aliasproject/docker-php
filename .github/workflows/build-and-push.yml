            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.4-fpm-nginx-${{ github.sha }}

      - name: Build and push PHP 8.4 FrankenPHP
        if: inputs.force_build_all || inputs.build_php_84 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.4/frankenphp/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.4/frankenphp
          file: php/8.4/frankenphp/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.4-frankenphp-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.4-frankenphp-${{ github.sha }}

      - name: Build and push PHP 8.4 FrankenPHP Dev
        if: inputs.force_build_all || inputs.build_php_84 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.4/frankenphp/Dockerfile.dev')
        uses: docker/build-push-action@v5
        with:
          context: php/8.4/frankenphp
          file: php/8.4/frankenphp/Dockerfile.dev
