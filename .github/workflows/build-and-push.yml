        uses: docker/build-push-action@v5
        with:
          context: php/8.2/frankenphp
          file: php/8.2/frankenphp/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.2-frankenphp-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.2-frankenphp-${{ github.sha }}

      - name: Build and push PHP 8.2 FrankenPHP Dev
