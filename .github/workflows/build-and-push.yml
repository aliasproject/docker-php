name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build_all:
        description: "Force build all images (ignore changed files)"
        required: false
        default: false
        type: boolean
      build_php_74:
        description: "Force build PHP 7.4 images"
        required: false
        default: false
        type: boolean
      build_php_80:
        description: "Force build PHP 8.0 images"
        required: false
        default: false
        type: boolean
      build_php_81:
        description: "Force build PHP 8.1 images"
        required: false
        default: false
        type: boolean
      build_php_82:
        description: "Force build PHP 8.2 images"
        required: false
        default: false
        type: boolean
      build_php_83:
        description: "Force build PHP 8.3 images"
        required: false
        default: false
        type: boolean
      build_php_84:
        description: "Force build PHP 8.4 images"
        required: false
        default: false
        type: boolean
      build_php_85:
        description: "Force build PHP 8.5 images"
        required: false
        default: false
        type: boolean

# A newer push to main supersedes whatever this workflow is still building
# for an older commit -- no reason to let a stale run keep consuming runner
# minutes (or block anything) once its result can no longer matter.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/php

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.changed-files.outputs.all_changed_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            php/7.4/cli/Dockerfile
            php/7.4/fpm/Dockerfile
            php/7.4/fpm-nginx/Dockerfile
            php/8.0/cli/Dockerfile
            php/8.0/fpm/alpine/Dockerfile
            php/8.0/fpm/ubuntu/Dockerfile
            php/8.0/fpm-nginx/Dockerfile
            php/8.1/cli/Dockerfile
            php/8.1/fpm/Dockerfile
            php/8.1/fpm-nginx/Dockerfile
            php/8.2/fpm/Dockerfile
            php/8.2/fpm-nginx/Dockerfile
            php/8.2/frankenphp/Dockerfile
            php/8.2/frankenphp/Dockerfile.dev
            php/8.2/frankenphp/Dockerfile.wordpress
            php/8.3/cli/Dockerfile
            php/8.3/frankenphp/Dockerfile
            php/8.3/frankenphp/Dockerfile.dev
            php/8.3/frankenphp/Dockerfile.wordpress
            php/8.4/cli/Dockerfile
            php/8.4/frankenphp/Dockerfile
            php/8.4/frankenphp/Dockerfile.dev
            php/8.4/frankenphp/Dockerfile.wordpress
            php/8.5/cli/Dockerfile
            php/8.5/frankenphp/Dockerfile
            php/8.5/frankenphp/Dockerfile.dev
            php/8.5/frankenphp/Dockerfile.wordpress

  # Images with no in-repo FROM dependency - safe to build fully in parallel.
  # The frankenphp images live in their own build-frankenphp-base job below:
  # every one of these still finishes in well under a minute (confirmed from
  # actual run logs), so there's nothing to gain from the digest-split/native
  # -arm64 treatment frankenphp needs - it would only add job overhead here.
  build-base:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 7.4-cli,        context: php/7.4/cli,        file: php/7.4/cli/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_74, tag: 7.4-cli }
          - { name: 7.4-fpm,        context: php/7.4/fpm,        file: php/7.4/fpm/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_74, tag: 7.4-fpm }
          - { name: 8.0-cli,        context: php/8.0/cli,        file: php/8.0/cli/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_80, tag: 8.0-cli }
          - { name: 8.0-fpm-alpine, context: php/8.0/fpm/alpine, file: php/8.0/fpm/alpine/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_80, tag: 8.0-fpm-alpine }
          - { name: 8.0-fpm-ubuntu, context: php/8.0/fpm/ubuntu, file: php/8.0/fpm/ubuntu/Dockerfile, platforms: "linux/amd64",              force_input: build_php_80, tag: 8.0-fpm-ubuntu }
          - { name: 8.1-cli,        context: php/8.1/cli,        file: php/8.1/cli/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_81, tag: 8.1-cli }
          - { name: 8.1-fpm,        context: php/8.1/fpm,        file: php/8.1/fpm/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_81, tag: 8.1-fpm }
          - { name: 8.2-fpm,        context: php/8.2/fpm,        file: php/8.2/fpm/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_82, tag: 8.2-fpm }
          - { name: 8.3-cli,        context: php/8.3/cli,        file: php/8.3/cli/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_83, tag: 8.3-cli }
          - { name: 8.4-cli,        context: php/8.4/cli,        file: php/8.4/cli/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_84, tag: 8.4-cli }
          - { name: 8.5-cli,        context: php/8.5/cli,        file: php/8.5/cli/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_85, tag: 8.5-cli }
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, matrix.file) }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # frankenphp base images, split by architecture across two native runners
  # instead of one QEMU multi-platform build. Measured from a real run: the
  # exact same install-php-extensions step took 258s on native amd64 vs
  # 2280s emulated on arm64 (8.8x) -- that single step alone was ~97% of
  # that job's wall clock. Each leg here pushes by digest only (no tags
  # yet); merge-frankenphp-base assembles the real multi-arch manifest once
  # both digests exist.
  build-frankenphp-base:
    needs: detect-changes
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "8.2", arch: amd64, force_input: build_php_82 }
          - { version: "8.2", arch: arm64, force_input: build_php_82 }
          - { version: "8.3", arch: amd64, force_input: build_php_83 }
          - { version: "8.3", arch: arm64, force_input: build_php_83 }
          - { version: "8.4", arch: amd64, force_input: build_php_84 }
          - { version: "8.4", arch: arm64, force_input: build_php_84 }
          - { version: "8.5", arch: amd64, force_input: build_php_85 }
          - { version: "8.5", arch: arm64, force_input: build_php_85 }
    steps:
      - name: Checkout code
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.version }}, ${{ matrix.arch }})
        id: build
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        uses: docker/build-push-action@v7
        with:
          context: php/${{ matrix.version }}/frankenphp
          file: php/${{ matrix.version }}/frankenphp/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=8.${{ matrix.version }}-frankenphp-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=8.${{ matrix.version }}-frankenphp-${{ matrix.arch }}

      - name: Export digest
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-fpbase-${{ matrix.version }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assembles the two per-arch digests above into one real multi-arch
  # manifest per version and tags it. Each version merges independently
  # (matrix, not a loop) so e.g. 8.2 doesn't sit around waiting on 8.5.
  merge-frankenphp-base:
    needs: [detect-changes, build-frankenphp-base]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "8.2", force_input: build_php_82 }
          - { version: "8.3", force_input: build_php_83 }
          - { version: "8.4", force_input: build_php_84 }
          - { version: "8.5", force_input: build_php_85 }
    steps:
      - name: Download digests
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-fpbase-${{ matrix.version }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.version }}-frankenphp \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.version }}-frankenphp-latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.version }}-frankenphp-${{ github.sha }} \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

  # Everything that's FROM an image build-base just pushed, minus frankenphp
  # (that has its own dependent stage below). needs: build-base only pulls
  # in the fast (<1 min) legs now that frankenphp moved out, so this no
  # longer inherits frankenphp's build time at all.
  build-dependent:
    needs: [detect-changes, build-base]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 7.4-fpm-nginx, context: php/7.4/fpm-nginx, file: php/7.4/fpm-nginx/Dockerfile, parent_file: php/7.4/fpm/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_74, tag: 7.4-fpm-nginx }
          - { name: 8.0-fpm-nginx, context: php/8.0/fpm-nginx, file: php/8.0/fpm-nginx/Dockerfile, parent_file: "",                       platforms: "linux/amd64,linux/arm64", force_input: build_php_80, tag: 8.0-fpm-nginx }
          - { name: 8.1-fpm-nginx, context: php/8.1/fpm-nginx, file: php/8.1/fpm-nginx/Dockerfile, parent_file: php/8.1/fpm/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_81, tag: 8.1-fpm-nginx }
          - { name: 8.2-fpm-nginx, context: php/8.2/fpm-nginx, file: php/8.2/fpm-nginx/Dockerfile, parent_file: php/8.2/fpm/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_82, tag: 8.2-fpm-nginx }
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, matrix.file) || (matrix.parent_file != '' && contains(needs.detect-changes.outputs.changed_files, matrix.parent_file)) }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # frankenphp-dev and frankenphp-wordpress, same digest-split/native-arm64
  # treatment as build-frankenphp-base and for the same reason: both FROM
  # the frankenphp base and both install real extensions (wordpress in
  # particular adds imagick, the single heaviest one in either Dockerfile).
  # needs: merge-frankenphp-base (not build-base) so this only waits on the
  # frankenphp base manifests actually being on the registry, not on the
  # unrelated fast cli/fpm legs.
  build-frankenphp-dependent:
    needs: [detect-changes, merge-frankenphp-base]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "8.2", variant: dev,       file: Dockerfile.dev,       arch: amd64, force_input: build_php_82 }
          - { version: "8.2", variant: dev,       file: Dockerfile.dev,       arch: arm64, force_input: build_php_82 }
          - { version: "8.2", variant: wordpress, file: Dockerfile.wordpress, arch: amd64, force_input: build_php_82 }
          - { version: "8.2", variant: wordpress, file: Dockerfile.wordpress, arch: arm64, force_input: build_php_82 }
          - { version: "8.3", variant: dev,       file: Dockerfile.dev,       arch: amd64, force_input: build_php_83 }
          - { version: "8.3", variant: dev,       file: Dockerfile.dev,       arch: arm64, force_input: build_php_83 }
          - { version: "8.3", variant: wordpress, file: Dockerfile.wordpress, arch: amd64, force_input: build_php_83 }
          - { version: "8.3", variant: wordpress, file: Dockerfile.wordpress, arch: arm64, force_input: build_php_83 }
          - { version: "8.4", variant: dev,       file: Dockerfile.dev,       arch: amd64, force_input: build_php_84 }
          - { version: "8.4", variant: dev,       file: Dockerfile.dev,       arch: arm64, force_input: build_php_84 }
          - { version: "8.4", variant: wordpress, file: Dockerfile.wordpress, arch: amd64, force_input: build_php_84 }
          - { version: "8.4", variant: wordpress, file: Dockerfile.wordpress, arch: arm64, force_input: build_php_84 }
          - { version: "8.5", variant: dev,       file: Dockerfile.dev,       arch: amd64, force_input: build_php_85 }
          - { version: "8.5", variant: dev,       file: Dockerfile.dev,       arch: arm64, force_input: build_php_85 }
          - { version: "8.5", variant: wordpress, file: Dockerfile.wordpress, arch: amd64, force_input: build_php_85 }
          - { version: "8.5", variant: wordpress, file: Dockerfile.wordpress, arch: arm64, force_input: build_php_85 }
    steps:
      - name: Checkout code
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/{1}', matrix.version, matrix.file)) || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/{1}', matrix.version, matrix.file)) || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/{1}', matrix.version, matrix.file)) || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.version }}-${{ matrix.variant }}, ${{ matrix.arch }})
        id: build
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/{1}', matrix.version, matrix.file)) || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        uses: docker/build-push-action@v7
        with:
          context: php/${{ matrix.version }}/frankenphp
          file: php/${{ matrix.version }}/frankenphp/${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.version }}-frankenphp-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}-frankenphp-${{ matrix.variant }}-${{ matrix.arch }}

      - name: Export digest
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/{1}', matrix.version, matrix.file)) || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/{1}', matrix.version, matrix.file)) || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-fpdep-${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-frankenphp-dependent:
    needs: [detect-changes, build-frankenphp-dependent]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "8.2", variant: dev,       force_input: build_php_82 }
          - { version: "8.2", variant: wordpress, force_input: build_php_82 }
          - { version: "8.3", variant: dev,       force_input: build_php_83 }
          - { version: "8.3", variant: wordpress, force_input: build_php_83 }
          - { version: "8.4", variant: dev,       force_input: build_php_84 }
          - { version: "8.4", variant: wordpress, force_input: build_php_84 }
          - { version: "8.5", variant: dev,       force_input: build_php_85 }
          - { version: "8.5", variant: wordpress, force_input: build_php_85 }
    steps:
      - name: Download digests
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile.{1}', matrix.version, matrix.variant)) || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-fpdep-${{ matrix.version }}-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile.{1}', matrix.version, matrix.variant)) || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile.{1}', matrix.version, matrix.variant)) || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile.{1}', matrix.version, matrix.variant)) || contains(needs.detect-changes.outputs.changed_files, format('php/{0}/frankenphp/Dockerfile', matrix.version)) }}
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.version }}-frankenphp-${{ matrix.variant }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.version }}-frankenphp-${{ matrix.variant }}-latest \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.version }}-frankenphp-${{ matrix.variant }}-${{ github.sha }} \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

  summary:
    runs-on: ubuntu-latest
    needs: [build-base, build-dependent, merge-frankenphp-base, merge-frankenphp-dependent]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## 🐳 Docker Images Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`ghcr.io/${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Available Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 7.4:** \`7.4-cli-latest\`, \`7.4-fpm-latest\`, \`7.4-fpm-nginx-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.0:** \`8.0-cli-latest\`, \`8.0-fpm-alpine-latest\`, \`8.0-fpm-ubuntu-latest\`, \`8.0-fpm-nginx-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.1:** \`8.1-cli-latest\`, \`8.1-fpm-latest\`, \`8.1-fpm-nginx-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.2:** \`8.2-fpm-latest\`, \`8.2-fpm-nginx-latest\`, \`8.2-frankenphp-latest\`, \`8.2-frankenphp-dev-latest\`, \`8.2-frankenphp-wordpress-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.3:** \`8.3-cli-latest\`, \`8.3-frankenphp-latest\`, \`8.3-frankenphp-dev-latest\`, \`8.3-frankenphp-wordpress-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.4:** \`8.4-cli-latest\`, \`8.4-frankenphp-latest\`, \`8.4-frankenphp-dev-latest\`, \`8.4-frankenphp-wordpress-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.5:** \`8.5-cli-latest\`, \`8.5-frankenphp-latest\`, \`8.5-frankenphp-dev-latest\`, \`8.5-frankenphp-wordpress-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ (needs.build-base.result == 'success' && needs.build-dependent.result == 'success' && needs.merge-frankenphp-base.result == 'success' && needs.merge-frankenphp-dependent.result == 'success') && '✅ All builds successful!' || '❌ Some builds failed' }}" >> $GITHUB_STEP_SUMMARY
