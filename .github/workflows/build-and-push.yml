            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.4-frankenphp-dev-${{ github.sha }}

      - name: Build and push PHP 8.4 FrankenPHP WordPress
        if: inputs.force_build_all || inputs.build_php_84 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.4/frankenphp/Dockerfile.wordpress')
        uses: docker/build-push-action@v5
        with:
          context: php/8.4/frankenphp
          file: php/8.4/frankenphp/Dockerfile.wordpress
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.4-frankenphp-wordpress-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.4-frankenphp-wordpress-${{ github.sha }}

  summary:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## 🐳 Docker Images Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`ghcr.io/${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Available Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 7.4:** \`7.4-cli-latest\`, \`7.4-fpm-latest\`, \`7.4-fpm-nginx-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.0:** \`8.0-cli-latest\`, \`8.0-fpm-alpine-latest\`, \`8.0-fpm-ubuntu-latest\`, \`8.0-fpm-nginx-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.1:** \`8.1-cli-latest\`, \`8.1-fpm-latest\`, \`8.1-fpm-nginx-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.2:** \`8.2-fpm-latest\`, \`8.2-fpm-nginx-latest\`, \`8.2-frankenphp-latest\`, \`8.2-frankenphp-dev-latest\`, \`8.2-frankenphp-wordpress-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.3:** \`8.3-cli-latest\`, \`8.3-fpm-latest\`, \`8.3-fpm-nginx-latest\`, \`8.3-frankenphp-latest\`, \`8.3-frankenphp-dev-latest\`, \`8.3-frankenphp-wordpress-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.4:** \`8.4-cli-latest\`, \`8.4-fpm-latest\`, \`8.4-fpm-nginx-latest\`, \`8.4-frankenphp-latest\`, \`8.4-frankenphp-dev-latest\`, \`8.4-frankenphp-wordpress-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.build-and-push.result == 'success' && '✅ All builds successful!' || '❌ Some builds failed' }}" >> $GITHUB_STEP_SUMMARY
