        uses: docker/build-push-action@v5
        with:
          context: php/8.2/frankenphp
          file: php/8.2/frankenphp/Dockerfile.dev
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.2-frankenphp-dev-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.2-frankenphp-dev-${{ github.sha }}

      - name: Build and push PHP 8.2 FrankenPHP WordPress
        if: inputs.force_build_all || inputs.build_php_82 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.2/frankenphp/Dockerfile.wordpress')
        uses: docker/build-push-action@v5
        with:
          context: php/8.2/frankenphp
          file: php/8.2/frankenphp/Dockerfile.wordpress
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.2-frankenphp-wordpress-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.2-frankenphp-wordpress-${{ github.sha }}

      # PHP 8.3
      - name: Build and push PHP 8.3 CLI
        if: inputs.force_build_all || inputs.build_php_83 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.3/cli/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.3/cli
          file: php/8.3/cli/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.3-cli-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.3-cli-${{ github.sha }}

      - name: Build and push PHP 8.3 FPM
        if: inputs.force_build_all || inputs.build_php_83 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.3/fpm/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.3/fpm
          file: php/8.3/fpm/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.3-fpm-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.3-fpm-${{ github.sha }}

      - name: Wait for 8.3-fpm to propagate
        if: (inputs.force_build_all || inputs.build_php_83 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.3/fpm/Dockerfile')) && (inputs.force_build_all || inputs.build_php_83 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.3/fpm-nginx/Dockerfile'))
        run: sleep 10

      - name: Build and push PHP 8.3 FPM-Nginx
        if: inputs.force_build_all || inputs.build_php_83 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.3/fpm-nginx/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.3/fpm-nginx
          file: php/8.3/fpm-nginx/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.3-fpm-nginx-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.3-fpm-nginx-${{ github.sha }}

      - name: Build and push PHP 8.3 FrankenPHP
        if: inputs.force_build_all || inputs.build_php_83 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.3/frankenphp/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.3/frankenphp
          file: php/8.3/frankenphp/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.3-frankenphp-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.3-frankenphp-${{ github.sha }}

      - name: Build and push PHP 8.3 FrankenPHP Dev
        if: inputs.force_build_all || inputs.build_php_83 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.3/frankenphp/Dockerfile.dev')
        uses: docker/build-push-action@v5
        with:
          context: php/8.3/frankenphp
          file: php/8.3/frankenphp/Dockerfile.dev
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.3-frankenphp-dev-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:8.3-frankenphp-dev-${{ github.sha }}

      - name: Build and push PHP 8.3 FrankenPHP WordPress
        if: inputs.force_build_all || inputs.build_php_83 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.3/frankenphp/Dockerfile.wordpress')
        uses: docker/build-push-action@v5
        with:
          context: php/8.3/frankenphp
          file: php/8.3/frankenphp/Dockerfile.wordpress
          push: true
          platforms: linux/amd64,linux/arm64
