name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build_all:
        description: "Force build all images (ignore changed files)"
        required: false
        default: false
        type: boolean
      build_php_74:
        description: "Force build PHP 7.4 images"
        required: false
        default: false
        type: boolean
      build_php_80:
        description: "Force build PHP 8.0 images"
        required: false
        default: false
        type: boolean
      build_php_81:
        description: "Force build PHP 8.1 images"
        required: false
        default: false
        type: boolean
      build_php_82:
        description: "Force build PHP 8.2 images"
        required: false
        default: false
        type: boolean
      build_php_83:
        description: "Force build PHP 8.3 images"
        required: false
        default: false
        type: boolean
      build_php_84:
        description: "Force build PHP 8.4 images"
        required: false
        default: false
        type: boolean
      build_php_85:
        description: "Force build PHP 8.5 images"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/php

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.changed-files.outputs.all_changed_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            php/7.4/cli/Dockerfile
            php/7.4/fpm/Dockerfile
            php/7.4/fpm-nginx/Dockerfile
            php/8.0/cli/Dockerfile
            php/8.0/fpm/alpine/Dockerfile
            php/8.0/fpm/ubuntu/Dockerfile
            php/8.0/fpm-nginx/Dockerfile
            php/8.1/cli/Dockerfile
            php/8.1/fpm/Dockerfile
            php/8.1/fpm-nginx/Dockerfile
            php/8.2/fpm/Dockerfile
            php/8.2/fpm-nginx/Dockerfile
            php/8.2/frankenphp/Dockerfile
            php/8.2/frankenphp/Dockerfile.dev
            php/8.2/frankenphp/Dockerfile.wordpress
            php/8.3/cli/Dockerfile
            php/8.3/frankenphp/Dockerfile
            php/8.3/frankenphp/Dockerfile.dev
            php/8.3/frankenphp/Dockerfile.wordpress
            php/8.4/cli/Dockerfile
            php/8.4/frankenphp/Dockerfile
            php/8.4/frankenphp/Dockerfile.dev
            php/8.4/frankenphp/Dockerfile.wordpress
            php/8.5/cli/Dockerfile
            php/8.5/frankenphp/Dockerfile
            php/8.5/frankenphp/Dockerfile.dev
            php/8.5/frankenphp/Dockerfile.wordpress

  # Images with no in-repo FROM dependency - safe to build fully in parallel.
  build-base:
    needs: detect-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 7.4-cli,        context: php/7.4/cli,        file: php/7.4/cli/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_74, tag: 7.4-cli }
          - { name: 7.4-fpm,        context: php/7.4/fpm,        file: php/7.4/fpm/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_74, tag: 7.4-fpm }
          - { name: 8.0-cli,        context: php/8.0/cli,        file: php/8.0/cli/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_80, tag: 8.0-cli }
          - { name: 8.0-fpm-alpine, context: php/8.0/fpm/alpine, file: php/8.0/fpm/alpine/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_80, tag: 8.0-fpm-alpine }
          - { name: 8.0-fpm-ubuntu, context: php/8.0/fpm/ubuntu, file: php/8.0/fpm/ubuntu/Dockerfile, platforms: "linux/amd64",              force_input: build_php_80, tag: 8.0-fpm-ubuntu }
          - { name: 8.1-cli,        context: php/8.1/cli,        file: php/8.1/cli/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_81, tag: 8.1-cli }
          - { name: 8.1-fpm,        context: php/8.1/fpm,        file: php/8.1/fpm/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_81, tag: 8.1-fpm }
          - { name: 8.2-fpm,        context: php/8.2/fpm,        file: php/8.2/fpm/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_82, tag: 8.2-fpm }
          - { name: 8.2-frankenphp, context: php/8.2/frankenphp, file: php/8.2/frankenphp/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_82, tag: 8.2-frankenphp }
          - { name: 8.3-cli,        context: php/8.3/cli,        file: php/8.3/cli/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_83, tag: 8.3-cli }
          - { name: 8.3-frankenphp, context: php/8.3/frankenphp, file: php/8.3/frankenphp/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_83, tag: 8.3-frankenphp }
          - { name: 8.4-cli,        context: php/8.4/cli,        file: php/8.4/cli/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_84, tag: 8.4-cli }
          - { name: 8.4-frankenphp, context: php/8.4/frankenphp, file: php/8.4/frankenphp/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_84, tag: 8.4-frankenphp }
          - { name: 8.5-cli,        context: php/8.5/cli,        file: php/8.5/cli/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_85, tag: 8.5-cli }
          - { name: 8.5-frankenphp, context: php/8.5/frankenphp, file: php/8.5/frankenphp/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_85, tag: 8.5-frankenphp }
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, matrix.file) }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Images that are FROM an image build-base just pushed. needs: build-base
  # guarantees the parent manifest is on the registry before these start,
  # replacing the old sleep-based "wait for propagation" steps.
  #
  # build-base's aggregate result is 'failure' if ANY leg fails, even ones
  # unrelated to a given dependent's parent - so this job must not gate on
  # that aggregate. Each dependent leg instead fails on its own if its
  # specific parent image wasn't actually pushed (the FROM pull will fail).
  build-dependent:
    needs: [detect-changes, build-base]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 7.4-fpm-nginx,             context: php/7.4/fpm-nginx, file: php/7.4/fpm-nginx/Dockerfile,             parent_file: php/7.4/fpm/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_74, tag: 7.4-fpm-nginx }
          - { name: 8.0-fpm-nginx,             context: php/8.0/fpm-nginx, file: php/8.0/fpm-nginx/Dockerfile,             parent_file: "",                            platforms: "linux/amd64,linux/arm64", force_input: build_php_80, tag: 8.0-fpm-nginx }
          - { name: 8.1-fpm-nginx,             context: php/8.1/fpm-nginx, file: php/8.1/fpm-nginx/Dockerfile,             parent_file: php/8.1/fpm/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_81, tag: 8.1-fpm-nginx }
          - { name: 8.2-fpm-nginx,             context: php/8.2/fpm-nginx, file: php/8.2/fpm-nginx/Dockerfile,             parent_file: php/8.2/fpm/Dockerfile,        platforms: "linux/amd64,linux/arm64", force_input: build_php_82, tag: 8.2-fpm-nginx }
          - { name: 8.2-frankenphp-dev,        context: php/8.2/frankenphp, file: php/8.2/frankenphp/Dockerfile.dev,       parent_file: php/8.2/frankenphp/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_82, tag: 8.2-frankenphp-dev }
          - { name: 8.2-frankenphp-wordpress,  context: php/8.2/frankenphp, file: php/8.2/frankenphp/Dockerfile.wordpress, parent_file: php/8.2/frankenphp/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_82, tag: 8.2-frankenphp-wordpress }
          - { name: 8.3-frankenphp-dev,        context: php/8.3/frankenphp, file: php/8.3/frankenphp/Dockerfile.dev,       parent_file: php/8.3/frankenphp/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_83, tag: 8.3-frankenphp-dev }
          - { name: 8.3-frankenphp-wordpress,  context: php/8.3/frankenphp, file: php/8.3/frankenphp/Dockerfile.wordpress, parent_file: php/8.3/frankenphp/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_83, tag: 8.3-frankenphp-wordpress }
          - { name: 8.4-frankenphp-dev,        context: php/8.4/frankenphp, file: php/8.4/frankenphp/Dockerfile.dev,       parent_file: php/8.4/frankenphp/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_84, tag: 8.4-frankenphp-dev }
          - { name: 8.4-frankenphp-wordpress,  context: php/8.4/frankenphp, file: php/8.4/frankenphp/Dockerfile.wordpress, parent_file: php/8.4/frankenphp/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_84, tag: 8.4-frankenphp-wordpress }
          - { name: 8.5-frankenphp-dev,        context: php/8.5/frankenphp, file: php/8.5/frankenphp/Dockerfile.dev,       parent_file: php/8.5/frankenphp/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_85, tag: 8.5-frankenphp-dev }
          - { name: 8.5-frankenphp-wordpress,  context: php/8.5/frankenphp, file: php/8.5/frankenphp/Dockerfile.wordpress, parent_file: php/8.5/frankenphp/Dockerfile, platforms: "linux/amd64,linux/arm64", force_input: build_php_85, tag: 8.5-frankenphp-wordpress }
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        if: ${{ inputs.force_build_all || inputs[matrix.force_input] || contains(needs.detect-changes.outputs.changed_files, matrix.file) || (matrix.parent_file != '' && contains(needs.detect-changes.outputs.changed_files, matrix.parent_file)) }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}-latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  summary:
    runs-on: ubuntu-latest
    needs: [build-base, build-dependent]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## 🐳 Docker Images Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** \`ghcr.io/${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Available Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 7.4:** \`7.4-cli-latest\`, \`7.4-fpm-latest\`, \`7.4-fpm-nginx-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.0:** \`8.0-cli-latest\`, \`8.0-fpm-alpine-latest\`, \`8.0-fpm-ubuntu-latest\`, \`8.0-fpm-nginx-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.1:** \`8.1-cli-latest\`, \`8.1-fpm-latest\`, \`8.1-fpm-nginx-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.2:** \`8.2-fpm-latest\`, \`8.2-fpm-nginx-latest\`, \`8.2-frankenphp-latest\`, \`8.2-frankenphp-dev-latest\`, \`8.2-frankenphp-wordpress-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.3:** \`8.3-cli-latest\`, \`8.3-frankenphp-latest\`, \`8.3-frankenphp-dev-latest\`, \`8.3-frankenphp-wordpress-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.4:** \`8.4-cli-latest\`, \`8.4-frankenphp-latest\`, \`8.4-frankenphp-dev-latest\`, \`8.4-frankenphp-wordpress-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PHP 8.5:** \`8.5-cli-latest\`, \`8.5-frankenphp-latest\`, \`8.5-frankenphp-dev-latest\`, \`8.5-frankenphp-wordpress-latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ (needs.build-base.result == 'success' && needs.build-dependent.result == 'success') && '✅ All builds successful!' || '❌ Some builds failed' }}" >> $GITHUB_STEP_SUMMARY
