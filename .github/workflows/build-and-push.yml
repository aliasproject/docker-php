        if: inputs.force_build_all || inputs.build_php_84 || contains(steps.changed-files.outputs.all_changed_files, 'php/8.4/cli/Dockerfile')
        uses: docker/build-push-action@v5
        with:
          context: php/8.4/cli
          file: php/8.4/cli/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
